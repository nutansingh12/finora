events {
  worker_connections 1024;
}

http {
  upstream backend {
    server backend:3001;
  }

  upstream web {
    server web:3000;
  }

  server {
    listen 80;

    location /api {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
